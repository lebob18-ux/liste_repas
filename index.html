<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Recettes IA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b6b">
    <!-- Tailwind CSS pour un design propre et rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-12">

    <!-- Header -->
    <header class="bg-red-500 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">🍳 Mes Recettes Magiques</h1>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Formulaire de capture -->
        <div class="bg-white p-4 rounded-xl shadow-md space-y-4">
            <h2 class="font-bold text-lg text-gray-700">Ajouter une recette</h2>
            
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Prendre en photo la recette :</label>
                <input type="file" id="recipe-photo" accept="image/*" capture="environment" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100"/>
            </div>

            <div id="preview-container" class="hidden text-center">
                <p class="text-xs text-gray-400 mb-1">Aperçu compressé :</p>
                <img id="image-preview" class="max-h-40 mx-auto rounded shadow" alt="Aperçu">
            </div>

            <button onclick="processAndSaveRecipe()" id="btn-submit" class="w-full bg-red-500 text-white py-3 rounded-lg font-bold shadow hover:bg-red-600 disabled:opacity-50">
                ✨ Analyser avec l'IA & Enregistrer
            </button>
            <p id="status-msg" class="text-xs text-center text-gray-500"></p>
        </div>

        <!-- Liste des recettes -->
        <div class="space-y-4">
            <h2 class="font-bold text-lg text-gray-700">Mes Recettes Enregistrées</h2>
            <div id="recipes-list" class="space-y-3">
                <!-- Rempli dynamiquement -->
            </div>
        </div>

    </main>

    <!-- Script Logique & Configuration en dur -->
    <script>
        // CONFIGURATION
        // ==========================================
        const SUPABASE_URL = "https://thbqkeugjvsxbryfnzuo.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_2-Ij-nrTPeK6rB-kSD-QTg_b42zNakq";
        const GEMINI_API_KEY = "AQ.Ab8RN6IvsGKP4haGmYZpyKYUsOwF9fFKbQVfK-qCdn_5rcbw6A";
        // ==========================================
        // Initialisation de Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Charger les recettes au démarrage
        window.addEventListener('DOMContentLoaded', () => {
            loadRecipes();
        });

        // Compression d'image et affichage de l'aperçu
        const photoInput = document.getElementById('recipe-photo');
        let compressedBlob = null;

        photoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('status-msg').innerText = "Compression de l'image...";
            compressedBlob = await compressImage(file, 800, 0.7);
            
            const previewUrl = URL.createObjectURL(compressedBlob);
            document.getElementById('image-preview').src = previewUrl;
            document.getElementById('preview-container').classList.remove('hidden');
            document.getElementById('status-msg').innerText = "Image prête à être analysée.";
        });

        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
                    };
                };
            });
        }

        // Fonction principale : Upload Storage + Appel Gemini API + Insert Supabase
async function processAndSaveRecipe() {
    if (!compressedBlob) {
        alert("Veuillez sélectionner ou prendre une photo de recette.");
        return;
    }

    const btn = document.getElementById('btn-submit');
    const status = document.getElementById('status-msg');
    btn.disabled = true;

    try {
        // 1. Upload de l'image compressée vers Supabase Storage
        status.innerText = "1/3 Upload de l'image...";
        const fileName = `recipe_${Date.now()}.jpg`;
        const { data: uploadData, error: uploadError } = await supabaseClient.storage
            .from('recipes-images')
            .upload(fileName, compressedBlob, { contentType: 'image/jpeg' });

        if (uploadError) throw uploadError;

        const { data: publicUrlData } = supabaseClient.storage
            .from('recipes-images')
            .getPublicUrl(fileName);
        const imageUrl = publicUrlData.publicUrl;

        // 2. Conversion du Blob en Base64 pour l'API Gemini
        status.innerText = "2/3 Analyse de la recette par l'IA...";
        const base64Data = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(compressedBlob);
        });

// Appel Gemini mis à jour
        const geminiResp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [
                        { text: "Analyse cette image de recette. Extrais les informations au format JSON strict avec EXACTEMENT ces clés : {\"title\": \"Titre de la recette\", \"ingredients\": \"Liste des ingrédients au format texte ou markdown\", \"instructions\": \"Étapes de préparation\"}" },
                        { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                    ]
                }]
            })
        });

        const geminiJson = await geminiResp.json();
        
        // Sécurité renforcée pour éviter le "cannot read properties of undefined"
        if (!geminiJson.candidates || !geminiJson.candidates[0]?.content?.parts?.[0]?.text) {
            console.error("Réponse brute Gemini :", geminiJson);
            throw new Error("L'IA n'a pas renvoyé de contenu valide. Vérifie ta clé API.");
        }

        let rawText = geminiJson.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const recipeData = JSON.parse(rawText);

        // 3. Enregistrement dans la table Supabase `recipes`
        status.innerText = "3/3 Enregistrement dans la base...";
        const { error: dbError } = await supabaseClient.from('recipes').insert([{
            title: recipeData.title || "Recette sans titre",
            ingredients: recipeData.ingredients || "",
            instructions: recipeData.instructions || "",
            image_url: imageUrl
        }]);

        if (dbError) throw dbError;

        status.innerText = "✅ Recette enregistrée avec succès !";
        photoInput.value = "";
        document.getElementById('preview-container').classList.add('hidden');
        compressedBlob = null;
        loadRecipes();

    } catch (err) {
        console.error(err);
        status.innerText = "❌ Erreur : " + err.message;
    } finally {
        btn.disabled = false;
    }
}

        // Charger et afficher les recettes depuis Supabase
        async function loadRecipes() {
            const { data, error } = await supabaseClient
                .from('recipes')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Erreur chargement:", error);
                return;
            }

            const listEl = document.getElementById('recipes-list');
            listEl.innerHTML = '';

            if (data.length === 0) {
                listEl.innerHTML = '<p class="text-sm text-gray-400 italic text-center">Aucune recette pour le moment.</p>';
                return;
            }

            data.forEach(recipe => {
                listEl.innerHTML += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex gap-3 items-center">
                        <img src="${recipe.image_url || 'https://via.placeholder.com/80'}" class="w-16 h-16 object-cover rounded-lg flex-shrink-0" alt="Miniature">
                        <div class="overflow-hidden">
                            <h3 class="font-bold text-sm text-gray-800 truncate">${recipe.title}</h3>
                            <p class="text-xs text-gray-500 line-clamp-2">${recipe.ingredients}</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
