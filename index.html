<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b6b">
<title>Recettes HelloFresh</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f4f4f1;color:#222;padding:118px 0 70px}
header{position:fixed;top:0;left:0;right:0;background:#fff;padding:8px;box-shadow:0 1px 4px #0003;z-index:5}
#q{width:100%;padding:11px;font-size:16px;border:1px solid #bbb;border-radius:8px}
#bar{display:flex;gap:6px;overflow-x:auto;padding-top:6px}
#bar button{white-space:nowrap}
button{border:1px solid #bbb;background:#fff;border-radius:16px;padding:7px 12px;font-size:14px}
button.on{background:#2e7d32;color:#fff;border-color:#2e7d32}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;box-shadow:0 -1px 4px #0003;z-index:5}
nav button{flex:1;border:0;border-radius:0;padding:16px 4px;background:#fff}
nav button.on{background:#2e7d32}
#list{padding:8px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.g{grid-template-columns:repeat(4,1fr)}}
.c{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px #0002}
.c img{width:100%;aspect-ratio:1200/640;object-fit:cover;display:block;background:#ddd}
.t{padding:6px 8px;font-weight:600;font-size:14px;cursor:pointer}
.c .t{height:56px;overflow:hidden}
.b{padding:0 6px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.b button{padding:5px 9px}
.p,details{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px #0002}
.p{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.p .t{flex:1 1 100%}
.p input{width:80px;padding:8px;font-size:16px;border:1px solid #bbb;border-radius:6px}
summary{font-weight:600;cursor:pointer}details.done{opacity:.5}
details label{display:block;padding:9px 0;border-top:1px solid #eee}
details label input{margin-right:8px;transform:scale(1.4)}
.s{opacity:.55;text-decoration:line-through}
#m{position:fixed;inset:0;background:#fff;overflow:auto;z-index:10;padding:0 0 30px}
#m[hidden]{display:none}#m img{width:100%;display:block}#mc{padding:12px}
#m h4{margin:14px 0 2px}#m li{margin:4px 0}
.x{position:sticky;top:0;float:right;margin:8px;background:#fff}
.e{color:#b00;padding:12px}.i{color:#777;padding:14px;text-align:center}
</style></head><body>
<header><input id="q" placeholder="Rechercher…" autocomplete="off"><div id="bar"></div></header>
<main id="list"></main>
<nav><button data-a="tab" data-v="rec">Recettes</button><button data-a="tab" data-v="pan">Paniers</button><button data-a="tab" data-v="cou">Courses</button><button data-a="tab" data-v="sto">Stock</button></nav>
<div id="m" hidden><button class="x" data-a="close">✕ Fermer</button><div id="mc"></div></div>
<script>
let G='';try{G=localStorage.getItem('hfg')||''}catch(e){}
let db;
function demarrer(){
 document.querySelector('nav').style.display=G?'':'none';
 if(!G){$('#list').innerHTML=`<div class="p"><div class="t">Nom de ton groupe</div>
  <div class="i" style="text-align:left">Choisis un nom difficile à deviner (ex : famille-dupont-2026). Tes parents saisissent le même nom pour partager les mêmes paniers, courses et stock.</div>
  <input id="gn" style="flex:1 1 100%;width:auto" placeholder="nom-du-groupe" autocapitalize="none"><button data-a="gok">Valider</button></div>`;return}
 db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{global:{headers:{'x-groupe':G},fetch:(u,o)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t))}}});
 try{Q=JSON.parse(localStorage.getItem('hfq_'+G)||'[]')}catch(e){Q=[]}
 if(lireCache())render();load()}
const $=s=>document.querySelector(s);
const S={tab:'rec',q:'',mode:'nom',f:'all',m:null,o:{},pers:(()=>{try{return+localStorage.getItem('hfp')||4}catch(e){return 4}})()};let R=[],P=[],ST=[],EX=[],PR=[],SC='',Q=[],HORS=false,SY=false;const ET={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const th=u=>(u||'').replace('w_1200','w_480').replace('h_640','h_256');
const rec=id=>R.find(r=>r.id==id);
const FR=[[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾']];
function fq(q){if(q==null)return'';const e=Math.floor(q+1e-6),f=q-e;if(f<.06)return''+e;
 for(const[v,s]of FR)if(Math.abs(f-v)<.04)return(e?e+' ':'')+s;return(Math.round(q*100)/100+'').replace('.',',')}
const ing=(i,c=1)=>i.q==null?`${esc(i.u)} ${esc(i.n)}`:`${fq(i.q*c)} ${esc(i.u)} ${esc(i.n)}`;
const ok=['UL','OL','LI','P','STRONG','EM','B','I','BR'];
function clean(h){const d=new DOMParser().parseFromString(h,'text/html');
 (function w(n){[...n.children].forEach(c=>{w(c);if(/^(SCRIPT|STYLE|IFRAME|OBJECT)$/.test(c.tagName))c.remove();
 else{[...c.attributes].forEach(a=>c.removeAttribute(a.name));if(!ok.includes(c.tagName))c.replaceWith(...c.childNodes)}})})(d.body);
 return d.body.innerHTML}

async function load(){await sync();
 const a=await db.from('hf_recettes').select('id,nom,image,ingredients,favori,deja_fait').order('nom');
 const b=await db.from('hf_paniers').select('*').order('id');
 if(a.error||b.error){HORS=true;badge();if(!R.length)$('#list').innerHTML=`<div class="e">Erreur Supabase : ${esc((a.error||b.error).message)}</div>`;return}
 R=a.data;P=b.data;const c=await db.from('hf_stock').select('*').order('nom');if(!c.error)ST=c.data;const dx=await db.from('hf_extras').select('*').order('id');if(!dx.error)EX=dx.data;
 const ey=await db.from('hf_produits').select('*').order('nom');if(!ey.error)PR=ey.data;HORS=false;ecrireCache();render()}

function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.tab));
 const q=$('#q');q.placeholder={rec:S.mode=='nom'?'Rechercher une recette…':'Ingrédients (ex : poulet, riz)',pan:'N° de panier ou recette',cou:'Filtrer un ingrédient',sto:'Rechercher dans le stock'}[S.tab];
 const bt=(a,v,t,on)=>`<button data-a="${a}" data-v="${v}" class="${on?'on':''}">${t}</button>`;
 $('#bar').innerHTML=S.tab=='rec'?bt('mode','nom','Nom',S.mode=='nom')+bt('mode','ing','Ingrédient',S.mode=='ing')+bt('lien','','＋ Lien',false)+' | '+
  [['all','Toutes'],['fav','★ Favoris'],['afaire','À faire'],['fait','✓ Faites']].map(([v,t])=>bt('f',v,t,S.f==v)).join(''):'';
 $('#bar').innerHTML+=`<span style="white-space:nowrap;margin-left:auto">👥 Pour <select id="pers" style="font-size:16px;padding:4px">${[1,2,3,4,5,6,8].map(n=>`<option ${n==S.pers?'selected':''}>${n}</option>`).join('')}</select><button data-a="grp" style="margin-left:6px">${HORS?'📴 ':''}👪 ${esc(G)}${Q.length?' ⏳'+Q.length:''}</button></span>`;
 if(S.tab=='cou')$('#bar').innerHTML=bt('cf','all','Tout',S.cf!='buy')+bt('cf','buy','À acheter',S.cf=='buy')+$('#bar').innerHTML;
 list()}

function list(){const L=$('#list');
 if(S.tab=='rec'){const terms=norm(S.q).split(',').map(x=>x.trim()).filter(Boolean);
  const r=R.filter(r=>(S.f!='fav'||r.favori)&&(S.f!='fait'||r.deja_fait)&&(S.f!='afaire'||!r.deja_fait)&&
   terms.every(t=>S.mode=='nom'?norm(r.nom).includes(t):r.ingredients.some(i=>norm(i.n).includes(t))));
  L.innerHTML=r.length?`<div class="g">${r.map(card).join('')}</div>`:'<div class="i">Aucune recette</div>'}
 else if(S.tab=='pan'){const t=norm(S.q);
  const r=P.filter(p=>rec(p.recette_id)&&(!t||norm(p.numero).includes(t)||norm(rec(p.recette_id).nom).includes(t)))
   .sort((a,b)=>(parseFloat(a.numero)||1e9)-(parseFloat(b.numero)||1e9)||a.id-b.id);
  L.innerHTML=r.length?r.map(p=>`<div class="p" data-pid="${p.id}"><div class="t" data-a="open" data-id="${p.recette_id}">${esc(rec(p.recette_id).nom)}</div>
   <label>Panier n° <input data-f="numero" inputmode="numeric" value="${esc(p.numero)}"></label>
   <label>Pers. <input data-f="pers" type="number" step="1" min="1" value="${Math.round(p.coef*200)/100}"></label><button data-a="del">✕ Retirer</button></div>`).join(''):
   '<div class="i">Aucun panier. Ajoute des recettes avec « ＋ Panier ».</div>'}
 else if(S.tab=='sto'){const t=norm(S.q);
  
  const us=['g','kg','ml','cl','l','cs','cc','pièce(s)','sachet(s)','pot(s)','paquet(s)','boîte(s)'];
  const items=ST.filter(z=>!t||norm(z.nom).includes(t));
  L.innerHTML=`
  <div class="p"><input id="sn" oninput="sug()" autocomplete="off" placeholder="Ingrédient (ex : Riz)" style="flex:1 1 60%;width:auto"><button data-a="scan" data-t="sn">📷 Scan</button>
  <input id="sq" type="number" step="any" inputmode="decimal" placeholder="Qté"><select id="su" style="font-size:16px;padding:8px">${us.map(u=>`<option>${u}</option>`).join('')}</select>
  <button data-a="stadd">＋ Ajouter</button></div><div class="i" style="padding:2px 0;text-align:left">Ingrédients de tes recettes — touche pour choisir :</div><div id="sg" style="display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 12px"></div>`+(items.length?items.map(z=>`<div class="p" data-sid="${z.id}"><div class="t">${esc(z.nom)}</div>
  <label><input data-s="1" type="number" step="any" inputmode="decimal" value="${z.quantite}"> ${esc(z.unite)}</label><button data-a="stdel">✕</button></div>`).join(''):'<div class="i">Stock vide</div>');sug()}
 else{const t=norm(S.q),m={};
  P.forEach(p=>{const r=rec(p.recette_id);if(r)r.ingredients.forEach((i,ix)=>{const k=norm(i.n);if(!k||(t&&!k.includes(t)))return;
   (m[k]??={nom:i.n,l:[]}).l.push({p,r,i,ix,d:p.coches.includes(ix)})})});
  const g=Object.entries(m).map(([k,v])=>({k,...v,d:v.l.every(x=>x.d)})).filter(x=>S.cf!='buy'||!etat(x).ok).sort((a,b)=>a.d-b.d||a.k.localeCompare(b.k));
  L.innerHTML=g.length?g.map(x=>{const u={};x.l.forEach(y=>{const c=y.i.u;u[c]=(u[c]||0)+(y.i.q==null?0:y.i.q*y.p.coef)});
   const tot=Object.entries(u).map(([c,v])=>v?`${fq(v)} ${esc(c)}`:esc(c)||'—').join(' + ');
   return`<details data-k="${esc(x.k)}" class="${x.d?'done':''}" ${S.o[x.k]?'open':''}><summary>${esc(x.nom)} — ${tot}${stk(x)}</summary>
   ${x.l.map(y=>`<label class="${y.d?'s':''}"><input type="checkbox" data-a="chk" data-pid="${y.p.id}" data-ix="${y.ix}" ${y.d?'checked':''}>
   <b>Panier ${esc(y.p.numero||'?')}</b> · ${esc(y.r.nom)} — ${ing(y.i,y.p.coef)}</label>`).join('')}</details>`}).join(''):
   '<div class="i">Liste vide : ajoute des recettes aux paniers.</div>';L.insertAdjacentHTML('afterbegin',extras())}}

let _ig=null;
function ig(){if(_ig&&_ig.n==R.length)return _ig;const m={};
 R.forEach(r=>r.ingredients.forEach(i=>{if(!i.n)return;const k=norm(i.n);const e=m[k]??={nom:i.n,c:0,u:{}};e.c++;e.u[i.u]=(e.u[i.u]||0)+1}));
 _ig={n:R.length,l:Object.values(m).sort((a,b)=>b.c-a.c)};return _ig}
function sug(){const el=$('#sg');if(!el)return;const t=norm($('#sn')?.value);const have=new Set(ST.map(z=>norm(z.nom)));
 const seen=new Set(),l=[...PR.map(p=>({nom:p.nom,c:0,u:{}})),...ig().l].filter(e=>{const k=norm(e.nom);if(have.has(k)||seen.has(k)||(t&&!k.includes(t)))return false;seen.add(k);return true}).slice(0,60);
 el.innerHTML=l.length?l.map(e=>`<button data-a="pick" data-n="${esc(e.nom)}">${esc(e.nom)}</button>`).join(''):'<span class="i">Aucune suggestion</span>'}
function ecrireCache(){try{localStorage.setItem('hfc_'+G,JSON.stringify({t:Date.now(),R,P,ST,EX,PR}))}catch(e){}}
function lireCache(){try{const c=JSON.parse(localStorage.getItem('hfc_'+G)||'null');if(c){R=c.R;P=c.P;ST=c.ST;EX=c.EX;PR=c.PR;return true}}catch(e){}return false}
const sq=()=>{try{localStorage.setItem('hfq_'+G,JSON.stringify(Q))}catch(e){}};
function badge(){const g=document.querySelector('[data-a="grp"]');if(g)g.textContent=(HORS?'📴 ':'')+'👪 '+G+(Q.length?' ⏳'+Q.length:'')}
async function envoyer(o){if(o.t=='upd')Q=Q.filter(q=>!(q.t=='upd'&&q.table==o.table&&q.id==o.id));Q.push(o);sq();badge();await sync()}
async function sync(){if(SY||!db||!Q.length)return;SY=true;
 try{while(Q.length){const o=Q[0];let x;
  if(o.t=='ins'){x=await db.from(o.table).insert(o.row).select().single();
   if(!x.error){const z=EX.find(z=>z.id==o.tmp);if(z)Object.assign(z,x.data);Q.forEach(q=>{if(q.id==o.tmp)q.id=x.data.id})}}
  else if(o.t=='del')x=await db.from(o.table).delete().eq('id',o.id);
  else x=await db.from(o.table).update(o.patch).eq('id',o.id);
  if(x.error&&/fetch|abort|network|load failed/i.test(x.error.message)){HORS=true;break}
  Q=Q.filter(q=>q!==o);sq()}}
 finally{SY=false;ecrireCache();badge()}}
function scanner(){return new Promise(async res=>{
 if(!('BarcodeDetector' in window)){const c=prompt('Scan indisponible sur ce navigateur. Tape le code-barres (chiffres) :');res(c?c.trim():null);return}
 const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column';
 ov.innerHTML='<video playsinline muted style="flex:1;width:100%;object-fit:cover"></video><button style="margin:12px;padding:14px;font-size:16px">Annuler</button>';
 document.body.appendChild(ov);const v=ov.querySelector('video');let on=true,st;
 const fin=c=>{on=false;if(st)st.getTracks().forEach(t=>t.stop());ov.remove();res(c)};
 ov.querySelector('button').onclick=()=>fin(null);
 try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  if(!on){st.getTracks().forEach(t=>t.stop());return}
  v.srcObject=st;await v.play();
  const d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
  while(on){try{const r=await d.detect(v);if(r.length){fin(r[0].rawValue);return}}catch(e){}await new Promise(r=>setTimeout(r,250))}
 }catch(e){fin(null);alert('Caméra inaccessible : '+e.message)}})}
async function nomProduit(code){const l=PR.find(p=>p.code==code);if(l)return l.nom;
 try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,product_name_fr');
  const j=await r.json();if(j.status==1)return(j.product.product_name_fr||j.product.product_name||'').trim()}catch(e){}return''}
async function memo(nom){if(!SC)return;const c=SC;SC='';
 const x=await db.from('hf_produits').upsert({code:c,nom},{onConflict:'groupe,code'}).select().single();
 if(!x.error&&x.data){PR=PR.filter(p=>p.code!=c);PR.push(x.data)}}
function extras(){const t=norm(S.q);
 return`<div class="p"><div class="t">Autres achats</div><input id="xn" placeholder="Produit" autocomplete="off" style="flex:1 1 50%;width:auto">
 <input id="xq" placeholder="Qté" style="width:70px"><button data-a="scan" data-t="xn">📷</button><button data-a="exadd">＋</button></div>`+
 EX.filter(x=>!t||norm(x.nom).includes(t)).map(x=>`<div class="p" data-xid="${x.id}"><label style="flex:1;${x.coche?'text-decoration:line-through;opacity:.55':''}">
 <input type="checkbox" data-a="xchk" ${x.coche?'checked':''} style="transform:scale(1.4);margin-right:8px"><b>${esc(x.nom)}</b> ${esc(x.qte)}</label><button data-a="xdel">✕</button></div>`).join('')}
function etat(x){const u={};x.l.forEach(y=>{u[y.i.u]=(u[y.i.u]||0)+(y.i.q==null?0:y.i.q*y.p.coef)});
 const sk=ST.filter(z=>norm(z.nom)==x.k);
 const r=Object.entries(u).map(([c,v])=>{const h=sk.filter(z=>z.unite==c).reduce((a,z)=>a+z.quantite,0);return{c,v,rest:Math.max(0,v-h)}});
 return{sk,r,ok:sk.length>0&&r.every(z=>z.v==0||z.rest==0)}}
function stk(x){const e=etat(x);if(!e.sk.length)return'';
 const have=e.sk.map(z=>`${fq(z.quantite)} ${esc(z.unite)}`).join(' + ');
 const buy=e.r.filter(z=>z.rest>0).map(z=>`${fq(z.rest)} ${esc(z.c)}`).join(' + ');
 return` · 🏠 ${have}`+(e.ok?' ✓':buy?` → à acheter : ${buy}`:'')}
function card(r){const n=P.filter(p=>p.recette_id==r.id);
 return`<div class="c" data-id="${r.id}"><img loading="lazy" data-a="open" src="${esc(th(r.image))}" data-o="${esc(r.image)}" onerror="this.onerror=null;this.src=this.dataset.o">
 <div class="t" data-a="open">${esc(r.nom)}</div><div class="b"><button data-a="fav">${r.favori?'★':'☆'}</button><button data-a="add">＋ Panier</button>
 ${n.length?'🧺 '+n.map(p=>esc(p.numero||'?')).join(', '):''}${r.deja_fait?' ✓':''}</div></div>`}

async function openR(id){S.m=id;$('#m').hidden=false;paint();
 if(!ET[id]){const x=await db.from('hf_recettes').select('etapes').eq('id',id).single();ET[id]=x.data?.etapes||[];if(S.m==id)paint()}}
function paint(){const r=rec(S.m);if(!r)return;const id=r.id,e=ET[id];
 $('#mc').scrollTop=0;
 $('#mc').innerHTML=`<img src="${esc(r.image)}"><h2>${esc(r.nom)}</h2><div class="b" data-id="${id}">
 <button data-a="fav">${r.favori?'★ Favori':'☆ Favori'}</button><button data-a="fait">${r.deja_fait?'✓ Déjà faite':'Marquer faite'}</button><button data-a="add">＋ Panier</button></div>
 <h4>Ingrédients (${S.pers} pers.)</h4><ul>${r.ingredients.map(i=>`<li>${ing(i,S.pers/2)}</li>`).join('')}</ul><h4>Préparation</h4>
 ${e?e.map((h,k)=>`<h4>Étape ${k+1}</h4>${clean(h)}`).join(''):'<div class="i">Chargement…</div>'}
 <p><a href="${esc(rec(id).url||'#')}" target="_blank" rel="noopener">Page HelloFresh</a></p>`}

async function flag(id,f){const r=rec(id);r[f]=!r[f];const x=await db.from('hf_recettes').update({[f]:r[f]}).eq('id',id);
 if(x.error){r[f]=!r[f];alert(x.error.message)}}
async function add(id){const x=await db.from('hf_paniers').insert({recette_id:id,coef:S.pers/2}).select().single();
 if(x.error)return alert(x.error.message);P.push(x.data);S.tab='pan';S.q='';$('#q').value='';$('#m').hidden=true;S.m=null;render()}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 const id=+(b.dataset.id||b.closest('[data-id]')?.dataset.id||0);
 if(a=='tab'){S.tab=b.dataset.v;S.q='';$('#q').value='';render()}
 else if(a=='mode'){S.mode=b.dataset.v;render()}
 else if(a=='f'){S.f=b.dataset.v;render()}
 else if(a=='open')openR(id);
 else if(a=='close'){$('#m').hidden=true;S.m=null}
 else if(a=='fav'||a=='fait'){await flag(id,a=='fav'?'favori':'deja_fait');if(S.m)paint();list()}
 else if(a=='add')add(id);
 else if(a=='pick'){const nom=b.dataset.n,e=ig().l.find(z=>z.nom==nom),su=$('#su');
  const u=e?Object.entries(e.u).sort((x,y)=>y[1]-x[1])[0][0]:'';
  $('#sn').value=nom;if(u){if(![...su.options].some(o=>o.text==u))su.add(new Option(u));su.value=u}
  $('#sq').focus();sug()}
 else if(a=='scan'){const t=b.dataset.t,code=await scanner();if(!code)return;SC=code;const nom=await nomProduit(code);
  if(!nom)alert('Produit inconnu : tape son nom, il sera mémorisé pour ce code-barres.');
  $('#'+t).value=nom;const q=$(t=='sn'?'#sq':'#xq');if(q)q.focus();if(t=='sn')sug()}
 else if(a=='exadd'){const nom=$('#xn').value.trim(),qte=$('#xq').value.trim();if(!nom)return;
  const tmp=-Date.now();EX.push({id:tmp,nom,qte,coche:false});list();ecrireCache();
  await envoyer({t:'ins',table:'hf_extras',row:{nom,qte},tmp});memo(nom)}
 else if(a=='xchk'){const z=EX.find(z=>z.id==+b.closest('[data-xid]').dataset.xid);z.coche=b.checked;
  list();ecrireCache();await envoyer({t:'upd',table:'hf_extras',id:z.id,patch:{coche:z.coche}})}
 else if(a=='xdel'){const xid=+b.closest('[data-xid]').dataset.xid;EX=EX.filter(z=>z.id!=xid);list();ecrireCache();await envoyer({t:'del',table:'hf_extras',id:xid})}
 else if(a=='gok'){const g=norm($('#gn').value).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(!g)return alert('Nom invalide');G=g;try{localStorage.setItem('hfg',G)}catch(_){}demarrer()}
 else if(a=='grp'){if(confirm('Changer de groupe ? Les données du groupe actuel restent enregistrées.')){try{localStorage.removeItem('hfg')}catch(_){}location.reload()}}
 else if(a=='cf'){S.cf=b.dataset.v;render()}
 else if(a=='stdel'){const sid=+b.closest('[data-sid]').dataset.sid;const x=await db.from('hf_stock').delete().eq('id',sid);
  if(x.error)return alert(x.error.message);ST=ST.filter(z=>z.id!=sid);list()}
 else if(a=='stadd'){const nom=$('#sn').value.trim(),q=parseFloat($('#sq').value),u=$('#su').value;
  if(!nom||!(q>=0))return alert('Ingrédient et quantité requis');
  const ex=ST.find(z=>norm(z.nom)==norm(nom)&&z.unite==u);
  if(ex){ex.quantite+=q;const x=await db.from('hf_stock').update({quantite:ex.quantite}).eq('id',ex.id);if(x.error)alert(x.error.message)}
  else{const x=await db.from('hf_stock').insert({nom,quantite:q,unite:u}).select().single();if(x.error)return alert(x.error.message);ST.push(x.data)}
  await memo(nom);
  list()}
 else if(a=='lien'){const u=prompt('Colle le lien de la recette HelloFresh :');if(!u)return;
  b.disabled=true;b.textContent='…';
  const x=await db.functions.invoke('ajouter-recette',{body:{url:u.trim()}});
  b.disabled=false;b.textContent='＋ Lien';const d=x.data;
  alert(x.error?x.error.message:d?.erreur?d.erreur:'Ajoutée : '+d.nom);if(d?.nom)await load()}
 else if(a=='del'){const pid=+b.closest('[data-pid]').dataset.pid;if(!confirm('Retirer ce panier ?'))return;
  const x=await db.from('hf_paniers').delete().eq('id',pid);if(x.error)return alert(x.error.message);P=P.filter(p=>p.id!=pid);list()}
 else if(a=='chk'){const p=P.find(p=>p.id==b.dataset.pid),ix=+b.dataset.ix;
  p.coches=b.checked?[...new Set([...p.coches,ix])]:p.coches.filter(v=>v!=ix);
  list();ecrireCache();await envoyer({t:'upd',table:'hf_paniers',id:p.id,patch:{coches:p.coches}})}});
document.addEventListener('change',async e=>{
 if(e.target.id=='pers'){S.pers=+e.target.value;try{localStorage.setItem('hfp',S.pers)}catch(_){}if(S.m)paint();return}
 if(e.target.dataset.s){const sid=+e.target.closest('[data-sid]').dataset.sid;const z=ST.find(z=>z.id==sid);
  z.quantite=parseFloat(e.target.value)||0;const x=await db.from('hf_stock').update({quantite:z.quantite}).eq('id',sid);if(x.error)alert(x.error.message);return}
 const f=e.target.dataset.f;if(!f)return;const pid=+e.target.closest('[data-pid]').dataset.pid;
 const p=P.find(p=>p.id==pid);const g=f=='pers'?'coef':f;
 const v=f=='pers'?(parseFloat(e.target.value)||2)/2:e.target.value.trim();
 p[g]=v;const x=await db.from('hf_paniers').update({[g]:v}).eq('id',pid);if(x.error)alert(x.error.message)});
document.addEventListener('toggle',e=>{if(e.target.dataset?.k)S.o[e.target.dataset.k]=e.target.open},true);
$('#q').addEventListener('input',e=>{S.q=e.target.value;list()});
addEventListener('online',()=>{if(db)load()});
setInterval(()=>{if(db&&(Q.length||HORS))load()},20000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
demarrer();
</script></body></html>
